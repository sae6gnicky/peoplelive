<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역사 인물의 이야기를 들어요</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; font-family: '맑은 고딕', sans-serif; overflow: hidden; }
        .container { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: relative; background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 첫 페이지 */
        #api-page { position: absolute; width: 100%; height: 100%; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 50; }
        .api-box { background: rgba(0,0,0,0.8); padding: 50px; border-radius: 15px; text-align: center; border: 1px solid #555; }
        
        /* 캐릭터 선택 페이지 */
        #select-page { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 40; background: #222; color: white; }
        .char-container { display: flex; gap: 40px; margin-top: 30px; }
        .char-box { width: 220px; height: 320px; background: #444; border: 3px solid #777; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .char-box:hover { transform: scale(1.05); border-color: #fff; background: #555; }
        .char-box h1 { font-size: 100px; margin: 0; color: #aaa; }
        
        /* 메인 대화 페이지 */
        #chat-page { position: absolute; width: 100%; height: 100%; display: none; z-index: 30; }
        .media-layer { position: absolute; width: 100%; height: 100%; object-fit: cover; top: 0; left: 0; }
        #char-video { z-index: 2; }
        #char-image { z-index: 1; display: none; }
        
        /* UI 요소 */
        .ui-layer { position: absolute; bottom: 8%; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        #mic-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 90px; height: 90px; font-size: 35px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: none; transition: 0.3s; }
        #mic-btn:hover { background: #c0392b; transform: scale(1.1); }
        
        #status-text { background: rgba(0,0,0,0.7); color: white; padding: 12px 25px; border-radius: 25px; margin-bottom: 20px; font-size: 22px; display: none; font-weight: bold; }
        
        /* 다른 인물 만나기 버튼 */
        #back-btn { position: absolute; top: 20px; left: 20px; padding: 8px 15px; font-size: 14px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; cursor: pointer; z-index: 20; display: none; transition: 0.2s; }
        #back-btn:hover { background: rgba(255,255,255,0.3); color: #fff; }

        /* 동영상 스킵 버튼 */
        #skip-btn { position: absolute; bottom: 30px; right: 30px; padding: 10px 20px; font-size: 16px; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; border-radius: 8px; cursor: pointer; z-index: 25; display: none; font-weight: bold; }
        #skip-btn:hover { background: rgba(255,255,255,0.9); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. 첫 페이지 -->
        <div id="api-page">
            <div class="api-box">
                <h2 style="font-size: 32px; margin-bottom: 30px;">📜 역사 인물의 이야기를 들어요</h2>
                <!-- 시작 버튼 -->
                <button onclick="startApp()" style="padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; font-weight: bold; background: #fff; color: #000; border: none;">역사 인물을 만나보시겠습니까?</button>
            </div>
        </div>

        <!-- 2. 인물 선택 페이지 -->
        <div id="select-page">
            <h1 style="margin-bottom: 10px;">누구와 대화하시겠습니까?</h1>
            <p style="color: #bbb; font-size: 20px;">원하는 인물의 박스를 선택하세요.</p>
            <div class="char-container">
                <div class="char-box" onclick="selectChar(0)"><h1>?</h1></div>
                <div class="char-box" onclick="selectChar(1)"><h1>?</h1></div>
                <div class="char-box" onclick="selectChar(2)"><h1>?</h1></div>
            </div>
        </div>

        <!-- 3. 영상 및 대화 페이지 -->
        <div id="chat-page">
            <video id="char-video" class="media-layer" playsinline></video>
            <img id="char-image" class="media-layer" src="" alt="캐릭터 이미지">
            
            <div class="ui-layer">
                <div id="status-text">마이크 버튼을 누르고 질문하세요!</div>
                <!-- 가짜 마이크 버튼 -->
                <button id="mic-btn">🎤</button>
            </div>
            
            <button id="back-btn" onclick="goBack()">다른 인물 만나기</button>
            <button id="skip-btn" onclick="skipVideo()">영상 건너뛰기 ⏭</button>
        </div>
    </div>

    <script>
        const CHARACTERS = [
            {
                name: "세종대왕",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/sejong.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/sejongking.png"
            },
            {
                name: "유관순",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/yukwansun.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/yukwan.png"
            },
            {
                name: "이순신",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/leesunshin.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/leesun.png"
            }
        ];

        let currentChar = null;

        // 시작 버튼 기능
        function startApp() {
            // 바로 화면만 전환하도록 처리
            document.getElementById('api-page').style.display = 'none';
            document.getElementById('select-page').style.display = 'flex';
        }

        // 캐릭터 선택 기능
        function selectChar(index) {
            currentChar = CHARACTERS[index];
            document.getElementById('select-page').style.display = 'none';
            document.getElementById('chat-page').style.display = 'block';
            document.getElementById('back-btn').style.display = 'block';
            
            const video = document.getElementById('char-video');
            const image = document.getElementById('char-image');
            const micBtn = document.getElementById('mic-btn');
            const statusText = document.getElementById('status-text');
            const skipBtn = document.getElementById('skip-btn');

            image.style.display = 'none';
            video.style.display = 'block';
            micBtn.style.display = 'none';
            statusText.style.display = 'none';
            skipBtn.style.display = 'block'; 

            video.src = currentChar.video;
            image.src = currentChar.image;
            
            video.play();
            
            video.onended = () => {
                video.style.display = 'none';
                image.style.display = 'block';
                micBtn.style.display = 'block';
                statusText.style.display = 'block';
                skipBtn.style.display = 'none'; 
                statusText.innerText = "마이크 버튼을 누르고 질문하세요!";
            };
        }

        function skipVideo() {
            const video = document.getElementById('char-video');
            video.pause();
            video.dispatchEvent(new Event('ended'));
        }

        function goBack() {
            const video = document.getElementById('char-video');
            video.pause();
            
            document.getElementById('chat-page').style.display = 'none';
            document.getElementById('select-page').style.display = 'flex';
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'none';
        }

        // 페이크 마이크 버튼 설정
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');

        micBtn.onclick = () => {
            // 마이크 버튼 클릭 시 아무 기능도 작동하지 않고 글자만 바뀜
            statusText.innerText = "현재 영상 전용 모드입니다.";
        };
    </script>
</body>
</html>
