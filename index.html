<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역사 인물과의 대화 (Gemini Audio 버전)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; font-family: '맑은 고딕', sans-serif; overflow: hidden; }
        .container { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; position: relative; background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 첫 페이지 */
        #api-page { position: absolute; width: 100%; height: 100%; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 50; }
        .api-box { background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px; text-align: center; border: 1px solid #555; }
        input[type="password"] { padding: 12px; width: 320px; font-size: 16px; margin: 15px 0 5px 0; border-radius: 5px; border: none; }
        .api-link { color: #8899a6; font-size: 13px; text-decoration: underline; display: block; margin-bottom: 20px; cursor: pointer; }
        .api-link:hover { color: #fff; }
        
        /* 캐릭터 선택 페이지 */
        #select-page { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 40; background: #222; color: white; }
        .char-container { display: flex; gap: 40px; margin-top: 30px; }
        .char-box { width: 220px; height: 320px; background: #444; border: 3px solid #777; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .char-box:hover { transform: scale(1.05); border-color: #fff; background: #555; }
        .char-box h1 { font-size: 100px; margin: 0; color: #aaa; }
        
        /* 메인 대화 페이지 */
        #chat-page { position: absolute; width: 100%; height: 100%; display: none; z-index: 30; }
        .media-layer { position: absolute; width: 100%; height: 100%; object-fit: cover; top: 0; left: 0; }
        #char-video { z-index: 2; }
        #char-image { z-index: 1; display: none; }
        
        /* UI 요소 */
        .ui-layer { position: absolute; bottom: 8%; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        #mic-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 90px; height: 90px; font-size: 35px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: none; transition: 0.3s; }
        #mic-btn:hover { background: #c0392b; transform: scale(1.1); }
        #mic-btn.recording { background: #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        
        #status-text { background: rgba(0,0,0,0.7); color: white; padding: 12px 25px; border-radius: 25px; margin-bottom: 20px; font-size: 22px; display: none; font-weight: bold; }
        #back-btn { position: absolute; bottom: 25px; right: 25px; padding: 12px 24px; font-size: 18px; background: rgba(0,0,0,0.6); color: white; border: 2px solid white; border-radius: 8px; cursor: pointer; z-index: 20; display: none; font-weight: bold; transition: 0.2s; }
        #back-btn:hover { background: rgba(255,255,255,0.9); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. API 입력 페이지 -->
        <div id="api-page">
            <div class="api-box">
                <h2>🔑 시스템 준비 (Gemini 네이티브 오디오)</h2>
                <p>무료 발급받은 <strong>구글 Gemini API 키</strong>를 입력해주세요.</p>
                <input type="password" id="api-key" placeholder="AIza..." /><br>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="api-link">무료 API 키 발급 및 복사하기 (새 창)</a>
                <button onclick="saveApiAndRequestMic()" style="padding: 12px 25px; font-size: 18px; cursor: pointer; border-radius: 8px; font-weight: bold;">마이크 허용 및 시작하기</button>
            </div>
        </div>

        <!-- 2. 인물 선택 페이지 -->
        <div id="select-page">
            <h1 style="margin-bottom: 10px;">누구와 대화하시겠습니까?</h1>
            <p style="color: #bbb; font-size: 20px;">원하는 인물의 박스를 선택하세요.</p>
            <div class="char-container">
                <div class="char-box" onclick="selectChar(0)"><h1>?</h1></div>
                <div class="char-box" onclick="selectChar(1)"><h1>?</h1></div>
                <div class="char-box" onclick="selectChar(2)"><h1>?</h1></div>
            </div>
        </div>

        <!-- 3. 영상 및 대화 페이지 -->
        <div id="chat-page">
            <video id="char-video" class="media-layer" playsinline></video>
            <img id="char-image" class="media-layer" src="" alt="캐릭터 이미지">
            
            <div class="ui-layer">
                <div id="status-text">마이크 버튼을 누르고 질문하세요!</div>
                <button id="mic-btn">🎤</button>
            </div>
            <button id="back-btn" onclick="goBack()">다른 인물 만나기</button>
        </div>
    </div>

    <script>
        // 오류를 수정한 공식 API 목소리(Charon, Leda, Algenib)로 원복
        const CHARACTERS = [
            {
                name: "세종대왕",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/sejong.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/sejongking.png",
                voice: "Charon", // 차분하고 지적인 톤
                prompt: "당신은 조선의 4대 왕 세종대왕입니다. 초등학교 2학년 학생과 대화하고 있습니다. 반드시 '~했소', '~하오' 같은 옛날 사극 말투를 사용하세요. 초등학교 2학년이 이해하기 쉬운 단어로, 다정하고 근엄하게 2~4문장으로 짧게 대답하세요."
            },
            {
                name: "유관순",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/yukwansun.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/yukwan.png",
                voice: "Leda", // 젊고 당찬 톤
                prompt: "당신은 독립운동가 유관순 열사입니다. 초등학교 2학년 학생과 대화하고 있습니다. 반드시 '~했어요', '~해요' 같은 현대 존댓말을 사용하세요. 초등학교 2학년이 이해하기 쉬운 단어로, 맑고 당차게 2~4문장으로 짧게 대답하세요."
            },
            {
                name: "이순신",
                video: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/leesunshin.mp4",
                image: "https://raw.githubusercontent.com/sae6gnicky/peaple/main/leesun.png",
                voice: "Algenib", // 매우 묵직하고 거친 장군 톤
                prompt: "당신은 조선의 명장 이순신 장군입니다. 초등학교 2학년 학생과 대화하고 있습니다. 반드시 '~했소', '~하오' 같은 옛날 사극 말투를 사용하세요. 초등학교 2학년이 이해하기 쉬운 단어로, 매우 묵직하고 용감하게 2~4문장으로 짧게 대답하세요."
            }
        ];

        let apiKey = "";
        let currentChar = null;
        let isWaiting = false;
        let audioCtx; 
        let activeSource = null;
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;

        function saveApiAndRequestMic() {
            apiKey = document.getElementById('api-key').value.trim();
            if(!apiKey) { alert("API 키를 입력해주세요!"); return; }
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(() => {
                    document.getElementById('api-page').style.display = 'none';
                    document.getElementById('select-page').style.display = 'flex';
                })
                .catch(err => alert("마이크 권한을 허용해야 진행할 수 있습니다."));
        }

        function selectChar(index) {
            currentChar = CHARACTERS[index];
            document.getElementById('select-page').style.display = 'none';
            document.getElementById('chat-page').style.display = 'block';
            document.getElementById('back-btn').style.display = 'block';
            
            const video = document.getElementById('char-video');
            const image = document.getElementById('char-image');
            const micBtn = document.getElementById('mic-btn');
            const statusText = document.getElementById('status-text');

            image.style.display = 'none';
            video.style.display = 'block';
            micBtn.style.display = 'none';
            statusText.style.display = 'none';

            video.src = currentChar.video;
            image.src = currentChar.image;
            
            video.play();
            
            video.onended = () => {
                video.style.display = 'none';
                image.style.display = 'block';
                micBtn.style.display = 'block';
                statusText.style.display = 'block';
                statusText.innerText = "마이크 버튼을 누르고 질문하세요!";
            };
        }

        function goBack() {
            if (activeSource) { activeSource.stop(); }
            const video = document.getElementById('char-video');
            video.pause();
            
            document.getElementById('chat-page').style.display = 'none';
            document.getElementById('select-page').style.display = 'flex';
            document.getElementById('back-btn').style.display = 'none';
            isWaiting = false;
            document.getElementById('mic-btn').classList.remove('recording');
        }

        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');

        micBtn.onclick = () => {
            if(isWaiting) return;
            if (activeSource) { activeSource.stop(); } 
            
            recognition.start();
            micBtn.classList.add('recording');
            statusText.innerText = "듣고 있습니다...";
        };

        recognition.onresult = async (event) => {
            micBtn.classList.remove('recording');
            const transcript = event.results[0][0].transcript;
            statusText.innerText = "답변을 생각 중입니다...";
            isWaiting = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: currentChar.prompt + " 학생의 질문: " + transcript }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"], 
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: {
                                        voiceName: currentChar.voice
                                    }
                                }
                            }
                        }
                    })
                });

                if (!response.ok) throw new Error("API 응답 오류");
                
                const data = await response.json();
                
                const audioPart = data.candidates[0].content.parts.find(p => p.inlineData && p.inlineData.mimeType.startsWith("audio/"));
                
                if (audioPart) {
                    const base64Audio = audioPart.inlineData.data;
                    const binaryString = window.atob(base64Audio);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    
                    const pcm16 = new Int16Array(bytes.buffer);
                    const audioBuffer = audioCtx.createBuffer(1, pcm16.length, 24000); 
                    const channelData = audioBuffer.getChannelData(0);
                    for (let i = 0; i < pcm16.length; i++) {
                        channelData[i] = pcm16[i] / 32768.0;
                    }
                    
                    activeSource = audioCtx.createBufferSource();
                    activeSource.buffer = audioBuffer;
                    activeSource.connect(audioCtx.destination);
                    
                    statusText.innerText = "대답하는 중...";
                    activeSource.start();
                    
                    activeSource.onended = () => {
                        statusText.innerText = "마이크 버튼을 누르고 질문하세요!";
                        isWaiting = false;
                    };
                } else {
                    throw new Error("음성 데이터를 받지 못했습니다.");
                }

            } catch(e) {
                statusText.innerText = "오류가 발생했습니다. 다시 시도해주세요.";
                console.error(e);
                isWaiting = false;
            }
        };

        recognition.onerror = () => {
            micBtn.classList.remove('recording');
            statusText.innerText = "마이크를 다시 눌러주세요.";
            isWaiting = false;
        };
    </script>
</body>
</html>
